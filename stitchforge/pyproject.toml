[project]
name = "stitchforge"
version = "0.1.0"
description = "Converte imagens em arquivos de bordado para maquinas de costura"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Sem isto o sistema exporta apenas DST (que e nativo e cobre a maioria das
# maquinas industriais). Com isto, tambem PES, JEF, EXP, VP3, XXX, U01, PEC.
formats = ["pyembroidery>=1.4"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
stitchforge = "stitchforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stitchforge*"]

[tool.setuptools.package-data]
stitchforge = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
